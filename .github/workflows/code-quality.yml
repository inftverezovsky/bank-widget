name: Tests and code quality

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  test-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: >-
          python -m pip install .
          "pytest>=8.3,<10" "pytest-cov>=6,<8"
          "flake8>=7.1,<8" "mypy>=1.13,<3" "isort>=5.13,<10"
          "types-requests>=2.32,<3" "pandas-stubs>=2.2,<4"
      - name: Check tracked files
        run: |
          ignored_files=$(git ls-files -ci --exclude-standard)
          if [ -n "$ignored_files" ]; then
            printf '%s\n' "$ignored_files"
            exit 1
          fi
      - name: Run pytest
        run: pytest
      - name: Run flake8
        run: flake8 src tests
      - name: Run mypy
        run: mypy src tests
      - name: Check imports with isort
        run: isort --check-only --diff src tests
