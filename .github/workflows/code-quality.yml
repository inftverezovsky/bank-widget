name: Tests and code quality

on:
  push:
    branches:
      - "feature/**"
  pull_request:
    branches:
      - develop

jobs:
  test-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: python -m pip install --upgrade pip pytest pytest-cov flake8 mypy isort

      - name: Run pytest
        run: pytest

      - name: Run flake8
        run: flake8 src tests

      - name: Run mypy
        run: mypy src tests

      - name: Check imports with isort
        run: isort --check-only --diff src tests
