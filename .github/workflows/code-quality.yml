name: Code quality

on:
  push:
    branches:
      - feature/homework_processing
  pull_request:
    branches:
      - develop

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install checks
        run: python -m pip install --upgrade pip flake8 mypy

      - name: Run flake8
        run: flake8 src tests

      - name: Run mypy
        run: mypy src tests
