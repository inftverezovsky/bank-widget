name: Generate coverage snapshot

on:
  push:
    branches:
      - feature/homework_decorators
    paths:
      - .github/workflows/coverage-snapshot.yml

permissions:
  contents: write

jobs:
  coverage-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: >-
          python -m pip install
          pytest==8.3.5 pytest-cov==6.0.0
          flake8==7.1.1 mypy==1.13.0 isort==5.13.2
      - name: Run tests with coverage
        run: pytest
      - name: Check style
        run: flake8 src tests
      - name: Check types
        run: mypy src tests
      - name: Check imports
        run: isort --check-only --diff src tests
      - name: Commit generated report
        run: |
          rm -f htmlcov/.gitignore htmlcov/status.json
          git add -- htmlcov
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add generated HTML coverage report'
          git push origin HEAD:feature/homework_decorators
