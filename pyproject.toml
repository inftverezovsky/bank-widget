[tool.poetry]
name = "bank-widget-homework"
version = "0.3.0"
description = "Utilities for banking operation widgets"
authors = ["Student"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
requests = ">=2.32,<3"
python-dotenv = ">=1.0,<2"
pandas = ">=2.2,<4"
openpyxl = ">=3.1,<4"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<10"
pytest-cov = ">=6,<8"

[tool.poetry.group.lint.dependencies]
flake8 = ">=7.1,<8"
black = ">=24.10,<27"
isort = ">=5.13,<10"
mypy = ">=1.13,<3"
types-requests = ">=2.32,<3"
pandas-stubs = ">=2.2,<4"

[tool.pytest.ini_options]
addopts = "--cov=src --cov-branch --cov-report=term-missing --cov-report=html:htmlcov --cov-fail-under=80"
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 119
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(\.git|\.venv|venv|__pycache__)/
'''

[tool.isort]
profile = "black"
line_length = 119
multi_line_output = 3
include_trailing_comma = true

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
exclude = [".venv", "venv"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
